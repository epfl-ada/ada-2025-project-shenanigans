<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>RQ3 - dumbbell plot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.85);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.3);
      --accent: #38bdf8;
      --pill-radius: 999px;
      --panel-radius: 14px;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: --bg;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .toggle-button {
      padding: 6px 14px;
      border-radius: var(--pill-radius);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .toggle-button:hover {
      transform: translateY(-1px);
      border-color: rgba(148, 163, 184, 0.65);
    }

    .toggle-button.active {
      background: var(--accent);
      color: #0b1120;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
      font-weight: 600;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      padding: 12px;
      width: min(1200px, 100%);
      height: clamp(420px, 60vh, 640px);
      display: flex;
      flex-direction: column;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      flex: 1;
      display: block;
    }

  </style>
</head>
<body>
  <h1 id="mainTitle"></h1>

  <div class="controls">
    <button class="toggle-button active" data-metric="ratio">like/dislike ratio</button>
    <button class="toggle-button" data-metric="duration">duration</button>
    <button class="toggle-button" data-metric="views">view count</button>
  </div>

  <div class="chart-card">
    <canvas id="dumbbellChart"></canvas>
  </div>

  <script>
    const dumbbellData = {"categories": ["Autos & Vehicles", "Comedy", "Education", "Entertainment", "Film & Animation", "Gaming", "Howto & Style", "Music", "News & Politics", "Nonprofits & Activism", "People & Blogs", "Pets & Animals", "Science & Technology", "Sports", "Travel & Events"], "metrics": {"ratio": {"non_sponsored": [96.2085308056872, 97.2252780833639, 97.37293042105952, 97.02351175587792, 96.80401831942491, 97.54140126368904, 96.84035279495811, 97.5517768077544, 95.04480481406469, 97.05882352941175, 97.47679213130789, 96.96780522607688, 96.37574323021428, 96.72996105186344, 97.36842105263158], "sponsored": [96.63334248346337, 98.04391250728008, 97.4757331737031, 97.27420964086888, 97.2, 97.83118940155198, 97.15846994535518, 97.70285210081602, 94.88105615854684, 96.61421809904375, 97.5969216696025, 96.96684250188396, 96.69421487603306, 97.15693031066118, 96.95554582563827]}, "duration": {"non_sponsored": [303.5, 213.0, 385.0, 319.75, 228.0, 554.25, 328.25, 217.0, 241.0, 192.25, 306.5, 149.0, 348.5, 210.0, 319.0], "sponsored": [597.0, 375.0, 594.0, 497.0, 353.0, 716.5, 494.0, 247.0, 438.0, 421.5, 537.5, 267.0, 554.75, 386.5, 605.25]}, "views": {"non_sponsored": [29294.0, 49098.0, 25170.0, 39258.5, 33362.5, 29904.75, 24647.5, 54709.0, 10842.0, 12473.5, 25702.5, 23630.0, 19908.0, 17879.75, 15168.5], "sponsored": [232830.0, 649481.5, 122755.0, 459750.75, 450867.5, 202712.0, 149617.25, 1293843.0, 175543.0, 92190.0, 261942.0, 790203.0, 90462.25, 250516.5, 156150.75]}}};

    const mainTitle = "Dumbbell plot - sponsored vs nonsponsored videos for different metrics";

    document.getElementById("mainTitle").textContent = mainTitle;

    const categories = dumbbellData.categories;

    const metricsConfig = {
      ratio: {
        label: "median like/dislike ratio",
        axisLabel: "like/dislike ratio [%]",
        unit: ""
      },
      duration: {
        label: "median duration",
        axisLabel: "duration [s]",
        unit: ""
      },
      views: {
        label: "median view count",
        axisLabel: "view count",
        unit: ""
      }
    };

    const metricData = {
      ratio: {
        nonSponsored: dumbbellData.metrics.ratio.non_sponsored,
        sponsored: dumbbellData.metrics.ratio.sponsored
      },
      duration: {
        nonSponsored: dumbbellData.metrics.duration.non_sponsored,
        sponsored: dumbbellData.metrics.duration.sponsored
      },
      views: {
        nonSponsored: dumbbellData.metrics.views.non_sponsored,
        sponsored: dumbbellData.metrics.views.sponsored
      }
    };

    let currentMetric = "ratio";
    let hoverIndex = null; 

    function buildDatasets(metricKey) {
      const nonSponsored = metricData[metricKey].nonSponsored;
      const sponsored = metricData[metricKey].sponsored;

      const dataNon = nonSponsored.map((value, i) => ({
        x: value,
        y: categories[i],
        category: categories[i],
        type: "Not sponsored"
      }));

      const dataSpon = sponsored.map((value, i) => ({
        x: value,
        y: categories[i],
        category: categories[i],
        type: "Sponsored"
      }));

      return { dataNon, dataSpon };
    }

    const initial = buildDatasets(currentMetric);
    const ctx = document.getElementById("dumbbellChart").getContext("2d");

    const dumbbellChart = new Chart(ctx, {
      type: "scatter",
      data: {
        datasets: [
          {
            label: "Not sponsored",
            data: initial.dataNon,
            backgroundColor: "#38bdf8",
            borderColor: "#bae6fd",
            pointRadius: 5,
            pointHoverRadius: 8
          },
          {
            label: "Sponsored",
            data: initial.dataSpon,
            backgroundColor: "#f472b6",
            borderColor: "#fce7f3",
            pointRadius: 5,
            pointHoverRadius: 8
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: "y",
        interaction: {
          mode: "nearest",
          intersect: false,
          axis: "xy"
        },
        animation: {
          duration: 700,
          easing: "easeOutCubic"
        },
        plugins: {
          legend: {
            position: "bottom",
            labels: {
              color: "#e5e7eb",
              font: { size: 12 },
              usePointStyle: true,
              pointStyle: "circle"
            }
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.96)",
            borderColor: "rgba(148, 163, 184, 0.6)",
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            titleColor: "#e5e7eb",
            bodyColor: "#e5e7eb",
            callbacks: {
              title: ctx => {
                const c = ctx[0].raw;
                return `${c.category} (${c.type})`;
              },
              label: ctx => {
                const chart = ctx.chart;
                const datasetIndex = ctx.datasetIndex;
                const dataIndex = ctx.dataIndex;

                const value = ctx.raw.x;
                const twinDatasetIndex = datasetIndex === 0 ? 1 : 0;
                const twinValue = chart.data.datasets[twinDatasetIndex].data[dataIndex].x;

                const conf = metricsConfig[currentMetric];
                const v = value.toFixed(2) + conf.unit;
                const vTwin = twinValue.toFixed(2) + conf.unit;

                const delta = (value - twinValue);
                const sign = delta >= 0 ? "+" : "";
                const deltaText = `${sign}${delta.toFixed(2)}${conf.unit}`;

                const otherLabel = twinDatasetIndex === 0 ? "Not sponsored" : "Sponsored";

                return [
                  `Value (${ctx.raw.type}) : ${v}`,
                  `Value (${otherLabel}) : ${vTwin}`,
                  `Difference : ${deltaText}`
                ];
              }
            }
          }
        },
        onHover: (event, _elements, chart) => {
          const points = chart.getElementsAtEventForMode(
            event,
            "nearest",
            { intersect: false },
            true
          );

          const canvas = chart.canvas;

          if (points.length > 0) {
            hoverIndex = points[0].index;
            canvas.style.cursor = "pointer";
          } else {
            hoverIndex = null;
            canvas.style.cursor = "default";
          }

          chart.draw();
        },
        scales: {
          y: {
            type: "category",
            labels: categories,
            offset: true,
            grid: {
              color: "rgba(15, 23, 42, 0.9)"
            },
            ticks: {
              color: "#94a3b8",
              font: { size: 11 }
            }
          },
          x: {
            title: {
              display: true,
              text: metricsConfig[currentMetric].axisLabel,
              color: "#e5e7eb",
              font: { size: 13 }
            },
            grid: {
              color: "rgba(15, 23, 42, 0.9)"
            },
            ticks: {
              color: "#94a3b8",
              font: { size: 11 }
            }
          }
        }
      },
      plugins: [
        {
          id: "dumbbellLines",
          beforeDatasetsDraw(chart) {
            const { ctx } = chart;
            const metaNon = chart.getDatasetMeta(0);
            const metaSpon = chart.getDatasetMeta(1);

            ctx.save();
            for (let i = 0; i < metaNon.data.length; i++) {
              const p1 = metaNon.data[i];
              const p2 = metaSpon.data[i];

              const isHover = (i === hoverIndex);

              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineWidth = isHover ? 4 : 2;
              ctx.strokeStyle = isHover
                ? "rgba(245, 158, 11, 1.0)"   
                : "rgba(148, 163, 184, 0.6)";
              ctx.stroke();
            }
            ctx.restore();
          }
        }
      ]
    });

    dumbbellChart.canvas.addEventListener("mouseleave", () => {
      hoverIndex = null;
      dumbbellChart.canvas.style.cursor = "default";
      dumbbellChart.draw();
    });

    const buttons = document.querySelectorAll(".toggle-button");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const metricKey = btn.getAttribute("data-metric");
        if (metricKey === currentMetric) return;

        currentMetric = metricKey;

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const updated = buildDatasets(currentMetric);
        dumbbellChart.data.datasets[0].data = updated.dataNon;
        dumbbellChart.data.datasets[1].data = updated.dataSpon;

        dumbbellChart.options.scales.x.title.text = metricsConfig[currentMetric].axisLabel;

        hoverIndex = null;
        dumbbellChart.update();
      });
    });
  </script>
</body>
</html>
