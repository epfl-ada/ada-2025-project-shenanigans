[workspace]
members = [
  "ltriang", "tograph", "tocategories", "tochannels", "filtercats", "education", "tags", "tolangs", "tourls", "todomains", "unshorten",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
flate2 = "1.1.2"
regex = "1.12.2"
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
