[workspace]
members = [
  "tourls", "todomains", "unshorten", "filterspon", "mergeunshortened", "tmp", "findsponsoredchannels", "utils", "ltriang", "tochanneldomains", "tograph", "tocats",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
flate2 = "1.1.2"
regex = "1.12.2"
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
petgraph = { version = "0.8.2", features = [ "serde", "serde-1", ] }
utils = { path = "utils" }
plot_utils = { path = "../analysis/plot_utils" }
