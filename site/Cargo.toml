[package]
name = "site"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
egui = { version = "0.32", default-features = false }
eframe = "0.32"
egui_extras = { version = "0.32", default-features = false }
egui_graphs = { version = "0.28", features = ["events"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
petgraph = { version = "0.8", default-features = false, features = [
  "graphmap",
  "stable_graph",
  "matrix_graph",
  "serde-1",
] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
serde_json = "1.0.145"
serde = "1.0.226"
flate2 = "1.1.2"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
